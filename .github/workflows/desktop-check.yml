name: Desktop core and host
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'desktop/**'
      - 'Cargo.*'
      - '.github/workflows/desktop-check.yml'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo build -p troy-desktop --features custom-protocol --locked
