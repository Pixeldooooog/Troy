name: Troy desktop release
on:
  push:
    tags: ['v2.*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - name: Check version
        working-directory: desktop
        run: node -e "if ('v'+require('./src-tauri/tauri.conf.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run tauri -- build --target universal-apple-darwin --bundles app
      - if: runner.os == 'macOS'
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Troy.app
          lipo -verify_arch x86_64 arm64 "$app/Contents/MacOS/troy-desktop"
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          mkdir release
          ditto -c -k --keepParent "$app" "release/Troy-${GITHUB_REF_NAME}-macOS-universal.zip"
      - if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          New-Item -ItemType Directory release
          Copy-Item $installers[0].FullName "release/Troy-$env:GITHUB_REF_NAME-Windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Troy-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Troy-*
          path: release
          merge-multiple: true
      - working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.zip *.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.exe SHA256SUMS.txt --verify-tag --repo "$GITHUB_REPOSITORY" --title "Troy ${GITHUB_REF_NAME#v}" --generate-notes --notes "黄金持仓总览、银行报价对比、分时与日周月 K 线、菜单栏与托盘。macOS 14+ 通用版（本地签名，未经 Apple 公证），Windows x64 安装包（未签名）。"
