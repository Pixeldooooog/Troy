name: macOS
on:
  push:
    branches: ['**']
    tags: ['v1.*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Test market logic
        run: swift test
      - name: Build universal app
        run: ./scripts/build-mac-app.zsh
      - name: Verify bundle and package disk image
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          tag="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/macOS/Info.plist)"
          if [[ "$IS_TAG" == "true" ]]; then tag="$GITHUB_REF_NAME"; fi
          ./scripts/package-release.zsh "$tag"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: troy-release
          path: |
            dist-macos/*.dmg
            dist-macos/*.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: troy-release
          path: release
      - name: Publish verified disk image
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check *.sha256
          gh release create "$GITHUB_REF_NAME" *.dmg *.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Troy ${GITHUB_REF_NAME#v}" \
            --notes "Universal macOS 14+ build for Apple Silicon and Intel. Ad hoc signed, without Apple notarization. Download the DMG and drag Troy into Applications."
