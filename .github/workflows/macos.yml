name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test market logic
        run: swift test
      - name: Build universal app
        run: ./scripts/build-mac-app.zsh
      - name: Verify bundle
        run: |
          codesign --verify --strict dist-macos/Troy.app
          lipo -verify_arch arm64 x86_64 dist-macos/Troy.app/Contents/MacOS/GoldMonitor
