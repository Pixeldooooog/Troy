name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Test market logic
        run: swift test
      - name: Build universal app
        run: ./scripts/build-mac-app.zsh
      - name: Verify bundle
        run: |
          codesign --verify --strict dist-macos/Troy.app
          architectures=$(xcrun lipo -archs dist-macos/Troy.app/Contents/MacOS/GoldMonitor)
          for arch in arm64 x86_64; do
            [[ " $architectures " == *" $arch "* ]] || exit 1
          done
